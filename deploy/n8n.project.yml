# deploy-kit Project Intent for n8n, the workflow automation at n8n.jorisjonkers.dev.
#
# The image is this repository's: n8n with the OIDC sign-in hooks built in. Each value
# below is read from the live objects fleet-infra runs in automation-system.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: n8n # the namespace derives: n8n-system
owner: joris

applications:
  - id: n8n
    migration: self # n8n runs its pending migrations on start

    exposure:
      - name: public
        # The host stays, so the MCP registrations and every webhook URL survive.
        host: n8n.jorisjonkers.dev
        # n8n signs people in itself (the OIDC hooks), and webhooks and the MCP server
        # carry their own credentials, so the edge adds no sign-in.
        audience: anonymous
        routes:
          - { path: /, match: prefix, process: n8n, surface: http }

    observability:
      scrape:
        process: n8n
        surface: http
        path: /metrics

    processes:
      - name: n8n
        lifecycle: application
        image: n8n # ghcr.io/jorisjonkers-dev/n8n; the lock resolves digest, uid and gid
        runtime: none

        provides:
          http: 5678

        dependsOn:
          # The login the edge derives: the owner role's, since n8n migrates itself.
          - application: platform-postgres
            surface: postgres
            credentials: { delivery: env, rotation: { tolerates: restart } }
          - { application: auth, surface: http }

        egress:
          to: internet
          reason: >-
            Workflows call outside APIs, and community nodes install from npm.

        secrets:
          # The key n8n encrypts stored credentials with, and the OIDC client secret
          # auth-api holds the other copy of.
          - path: secret/data/platform/automation
            keys: [n8n.encryption_key, n8n.oauth_client_secret]
            access: read
            delivery: env
            rotation: { tolerates: restart }

        # A fresh volume: the encryption key comes from Vault, and the community nodes
        # n8n reinstalls from n8n_db.installed_packages on start.
        volumes:
          - claim: n8n-data
            mountAt: /home/node/.n8n
            size: 2Gi
            durability: reconstructible

        # The live pod uses about 430Mi; the old path limited it at 1536Mi.
        placement:
          memory: 1536Mi
          cpu: 250m

        # Checked against the image on a read-only root: n8n writes its cache at start,
        # npm needs its own directory to install a community node, and data table
        # uploads land in /tmp.
        writablePaths: [/home/node/.cache, /home/node/.npm, /tmp]

        probes:
          # /healthz answers while n8n is still starting; readiness waits for the database.
          readiness: { path: /healthz/readiness, port: 5678 }
          liveness: { path: /healthz, port: 5678 }

        startupBudget: 300s # migrations and community-node installs come first

        # One main process owns the volume, and n8n runs one main process without queue mode.
        cutover: interrupted
