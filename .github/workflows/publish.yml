# A v*.*.* tag (pushed by release.yml with the App token) builds and pushes the
# multi-arch image, reads it back by digest and runs the image tests on it, then
# publishes the Intent Fragment the estate composes:
#   publish-image -> verify-image -> resolve-image-lock -> fragment
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@1efce81af819868fb2f5fd99ee7b04a1275845d8 # v0.18.0
    with:
      image-name: n8n
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write

  verify-image:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Resolve the published digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/n8n
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<<"$manifest")"
          case "$digest" in
            sha256:*) ;;
            *) echo "E_FLOATING_IMAGE: no digest for ${IMAGE}:${TAG}" >&2; exit 1 ;;
          esac
          platforms="$(jq -r '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | join(",")' <<<"$manifest")"
          case "$platforms" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) ;;
            *) echo "E_SINGLE_ARCH: expected linux/amd64 and linux/arm64, got '$platforms'" >&2; exit 1 ;;
          esac
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}:${TAG} as ${digest} (${platforms})" >> "$GITHUB_STEP_SUMMARY"

      - name: The published image passes the image tests
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
        run: |
          docker pull "$IMAGE"
          npm test

  # The images lock: the pushed digest, under the alias the project file names, with
  # the user the image runs as, read from what was pushed.
  resolve-image-lock:
    needs: [verify-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: images-lock-${{ github.run_id }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The commit the release was cut from, so the fragment names it however publish was started.
      - name: source-commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: lock-images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          {
            echo 'apiVersion: lock.jorisjonkers.dev/v1'
            echo 'kind: ImagesLock'
            echo 'schemaVersion: 1.0.0'
            echo 'name: n8n'
            echo 'images:'
          } > images.lock.yml
          for alias in n8n; do
            image="ghcr.io/jorisjonkers-dev/${alias}"
            digest="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::no digest for ${image}:${TAG}"; exit 1 ;;
            esac
            user="$(docker buildx imagetools inspect "${image}@${digest}" --format '{{ json .Image }}' \
              | jq -r 'if has("linux/amd64") then .["linux/amd64"] else . end | .config.User')"
            case "$user" in
              *[!0-9:]*|"") echo "::error::${alias} runs as '${user}', not a numeric uid[:gid]"; exit 1 ;;
            esac
            {
              echo "  ${alias}:"
              echo "    repository: ${image}"
              echo "    digest: \"${digest}\""
              echo "    uid: ${user%%:*}"
              echo "    gid: ${user##*:}"
            } >> images.lock.yml
          done
          cat images.lock.yml >> "$GITHUB_STEP_SUMMARY"

      - name: upload-image-lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-lock-${{ github.run_id }}
          path: images.lock.yml
          retention-days: 1

  fragment:
    needs: [resolve-image-lock]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@d6105981bb2d8e2caa879c3a62d9fd2ef86c216c # v0.31.0
    with:
      project-file: deploy/n8n.project.yml
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ref: ${{ needs.resolve-image-lock.outputs.source-sha }}
      validate-with: deploy/env
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
