# A v*.*.* tag (pushed by release.yml with the App token) builds and pushes the
# multi-arch image, reads it back by digest and runs the image tests on it, then
# publishes the Intent Fragment the estate composes:
#   publish-image -> verify-image -> resolve-image-lock -> fragment
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@618d5851b22d2c46d4234deaa07e0f1950e2b65d # v0.34.3
    with:
      image-name: n8n
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write

  verify-image:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Resolve the published digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/n8n
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<<"$manifest")"
          case "$digest" in
            sha256:*) ;;
            *) echo "E_FLOATING_IMAGE: no digest for ${IMAGE}:${TAG}" >&2; exit 1 ;;
          esac
          platforms="$(jq -r '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | join(",")' <<<"$manifest")"
          case "$platforms" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) ;;
            *) echo "E_SINGLE_ARCH: expected linux/amd64 and linux/arm64, got '$platforms'" >&2; exit 1 ;;
          esac
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}:${TAG} as ${digest} (${platforms})" >> "$GITHUB_STEP_SUMMARY"

      - name: The published image passes the image tests
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
        run: |
          docker pull "$IMAGE"
          npm test

  # The images lock: the pushed digest, under the alias the project file names, with the user the
  # image runs as and the n8n version it ships, read back from what was pushed.
  resolve-image-lock:
    needs: [verify-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: ${{ steps.lock.outputs.images-lock-artifact }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The commit the release was cut from, so the fragment names it however publish was started.
      - name: source-commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: lock-images
        id: lock
        uses: JorisJonkers-dev/github-workflows/actions/resolve-image-lock@618d5851b22d2c46d4234deaa07e0f1950e2b65d # v0.34.3
        with:
          name: n8n
          images: n8n
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  fragment:
    needs: [resolve-image-lock]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@618d5851b22d2c46d4234deaa07e0f1950e2b65d # v0.34.3
    with:
      project-file: deploy/n8n.project.yml
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ref: ${{ needs.resolve-image-lock.outputs.source-sha }}
      validate-with: deploy/env
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
