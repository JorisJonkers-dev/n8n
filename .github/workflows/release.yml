# Tag -> release flow (org standard).
#
# release-please maintains a release PR that accumulates conventional commits and, when merged,
# creates a vX.Y.Z tag and GitHub Release. The version counts this repository's own changes; the
# n8n version the image ships is the images lock's `version` (JorisJonkers-dev/workspace#140).
#
# The tag starts publish.yml, which builds the image and publishes the Intent Fragment. It is
# created with the App token, because a tag pushed with GITHUB_TOKEN would not start a workflow.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: assert-token-minted
        # Fail loudly if the App token is missing; never fall back to GITHUB_TOKEN.
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "E_APP_TOKEN_MISSING: Release App token was not minted." >&2
            exit 1
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
